[package]
name = "md-light"
version = "0.1.0"
description = "A lightweight Typora-style WYSIWYG Markdown editor"
edition = "2021"
license = "MIT"

[lib]
name = "md_light_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
